name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: "**/pyproject.toml"

      - name: Install dev dependencies
        run: pip install -e ".[dev]"
        # Core deps are lightweight (no torch/mlflow/etc) — installs in ~30 s

      - name: Ruff lint
        run: ruff check src tests scripts

      - name: Ruff format check
        run: ruff format --check src tests scripts

      - name: Mypy type check
        run: mypy src

  test:
    name: Unit & Behavioral Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: "**/pyproject.toml"

      - name: Install dependencies
        run: pip install --prefer-binary -e ".[dev,validation,features,survival]"
        # core + dev + GE + sklearn + sksurv/xgboost; torch/sentence-transformers skipped (too large for CI)

      - name: Run test suite
        run: |
          pytest tests/unit tests/behavioral \
            -v \
            --cov=src/chrono_ltv \
            --cov-report=xml \
            --cov-report=term-missing

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false
