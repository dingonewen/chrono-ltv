[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chrono-ltv"
version = "0.1.0"
description = "End-to-End Multimodal Customer Churn & Dynamic LTV Predictive Pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

# Core: lightweight packages needed for the simulator, schemas, and utilities.
# Heavy ML / MLOps / serving packages are in optional groups installed on demand.
dependencies = [
    "faker>=24.0.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "scipy>=1.13.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "loguru>=0.7.2",
    "rich>=13.7.0",
    "tenacity>=8.3.0",
    "python-dotenv>=1.0.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
# Install per pipeline step — never install everything at once in CI
ml = [
    "scikit-learn>=1.4.0",
    "scikit-survival>=0.22.0",
    "xgboost>=2.0.0",
    "torch>=2.2.0",
    "sentence-transformers>=3.0.0",
]
mlops = [
    "mlflow>=2.13.0",
    "hydra-core>=1.3.2",
    "omegaconf>=2.3.0",
]
serving = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
]
validation = [
    "great-expectations>=1.0.0",
]
features = [
    "scikit-learn>=1.4.0",
]
survival = [
    "scikit-survival>=0.22.0",
    "xgboost>=2.0.0",
]
monitoring = [
    "evidently>=0.7.0",
]
dashboard = [
    "streamlit>=1.35.0",
    "matplotlib>=3.9.0",
]
# dev: test + lint tools only — no heavy ML deps
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "ipykernel>=6.29.0",
]
# Convenience: install every optional group at once (local dev / Docker)
all = ["chrono-ltv[ml,mlops,serving,validation,monitoring,dashboard]"]

[project.scripts]
chrono-simulate = "scripts.generate_data:app"
chrono-train    = "scripts.train:app"
chrono-monitor  = "scripts.monitor:app"

[tool.setuptools.packages.find]
where = ["src"]

# ---------------------------------------------------------------------------
# Ruff (linter + formatter, replaces flake8/black/isort)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "TCH"]
ignore = ["E501"]  # line-length handled by formatter

[tool.ruff.lint.flake8-bugbear]
# typer.Option / typer.Argument are designed to appear in function-argument defaults
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.ruff.lint.flake8-type-checking]
# Pydantic evaluates field annotations at runtime even with PEP 563 deferred eval
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "TCH"]   # allow assert + stdlib imports outside TYPE_CHECKING

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
exclude = ["notebooks/"]

[[tool.mypy.overrides]]
# FastAPI route decorators are untyped in some FastAPI / mypy version combos
module = "chrono_ltv.serving.api"
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
# great-expectations stubs don't explicitly export expectation classes
module = "chrono_ltv.data.validators"
ignore_errors = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths  = ["tests"]
addopts    = "-ra -q --cov=src/chrono_ltv --cov-report=term-missing --cov-fail-under=65"
asyncio_mode = "auto"
log_cli    = true
log_level  = "INFO"

[tool.coverage.run]
omit = [
    "src/chrono_ltv/features/*",
    "src/chrono_ltv/models/*",
    "src/chrono_ltv/training/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
]
