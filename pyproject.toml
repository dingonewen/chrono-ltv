[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "chrono-ltv"
version = "0.1.0"
description = "End-to-End Multimodal Customer Churn & Dynamic LTV Predictive Pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    # Data & Simulation
    "faker>=24.0.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",         # Parquet I/O
    "scipy>=1.13.0",

    # ML & Survival Analysis
    "scikit-learn>=1.4.0",
    "scikit-survival>=0.22.0",
    "xgboost>=2.0.0",
    "torch>=2.2.0",
    "sentence-transformers>=3.0.0",  # Text embeddings for support tickets

    # MLOps
    "mlflow>=2.13.0",
    "hydra-core>=1.3.2",       # Config management
    "omegaconf>=2.3.0",

    # Serving
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",

    # Data Quality & Monitoring
    "great-expectations>=0.18.0",
    "evidently>=0.4.30",

    # Utilities
    "loguru>=0.7.2",
    "rich>=13.7.0",
    "tenacity>=8.3.0",
    "python-dotenv>=1.0.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",           # FastAPI test client
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "ipykernel>=6.29.0",
]

[project.scripts]
chrono-simulate = "scripts.generate_data:app"
chrono-train    = "scripts.train:app"
chrono-monitor  = "scripts.monitor:app"

[tool.setuptools.packages.find]
where = ["src"]

# ---------------------------------------------------------------------------
# Ruff (linter + formatter, replaces flake8/black/isort)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "TCH"]
ignore = ["E501"]  # line-length handled by formatter

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]   # allow assert in tests

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
exclude = ["notebooks/"]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths  = ["tests"]
addopts    = "-ra -q --cov=src/chrono_ltv --cov-report=term-missing --cov-fail-under=80"
asyncio_mode = "auto"
log_cli    = true
log_level  = "INFO"

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
]
