# @package _global_.model

name: cox_ph
type: cox_proportional_hazards

cox_ph:
  alpha: 1.0          # L2 regularisation (ties_method: breslow)
  ties: "breslow"
  n_iter: 100
  tol: 1e-9

xgb_survival:
  objective: "survival:cox"
  n_estimators: 400
  max_depth: 6
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8
  min_child_weight: 5
  eval_metric: "cox-nloglik"
  early_stopping_rounds: 30

deepsurv:
  hidden_dims: [256, 128, 64]
  dropout: 0.3
  batch_norm: true
  activation: "selu"
  learning_rate: 1e-3
  weight_decay: 1e-4
  batch_size: 256
  max_epochs: 200
  patience: 15          # early stopping patience

evaluation:
  n_splits: 5           # stratified k-fold CV
  time_bins: [30, 60, 90, 180, 365]  # days — for time-dependent AUC
